spring:
  application:
    name: task-tracker-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/task_tracker_backend?currentSchema=public
    username: postgres
    password: kola2010
    driver-class-name: org.postgresql.Driver

  ## database init settings
  sql:
    init:
      mode: embedded
      platform: postgresql
      schema-locations:
        - classpath:create-tables.sql
        - classpath:add-constraints.sql
      separator: ;
      continue-on-error: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        time_zone: UTC

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    time-zone: "UTC"
