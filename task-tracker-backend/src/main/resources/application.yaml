spring:
  application:
    name: task-tracker-backend
  datasource:
    url: jdbc:postgres://localhost:5432/task_tracker_backend?currentSchema=public
    username: postgres
    password: kola2010
    driver-class-name: org.postgresql.Driver

  ## database init settings
  sql:
    init:
      mode: always
      platform: postgresql
      schema-locations:
        - classpath:create-tables.sql
        - classpath:add-constraints.sql
      separator: ;
      continue-on-error: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgresSQLDialect
        format_sql: true
