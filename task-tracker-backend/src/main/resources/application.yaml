spring:

  application:
    name: task-tracker-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/task_tracker_backend?currentSchema=public
    username: postgres
    password: kola2010
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.json
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        time_zone: UTC

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    time-zone: "UTC"

