spring:
  main:
    banner-mode: 'off'
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema/schema.sql

  liquibase:
    enabled: false

jwt:
  access:
    lifetime: 3600
  refresh:
    lifetime: 86400
