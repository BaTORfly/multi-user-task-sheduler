x-prod-logging: &prod-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-prod-spring-logging-env: &prod-spring-logging-env
  SPRING_MAIN_BANNER_MODE: "off"
  SPRING_MAIN_LOG_STARTUP_INFO: "false"
  LOGGING_LEVEL_ROOT: WARN
  LOGGING_LEVEL_IO_GITHUB_BATORFLY: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
  LOGGING_LEVEL_ORG_APACHE_KAFKA: WARN
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: WARN
  LOGGING_LEVEL_COM_NETFLIX_EUREKA: WARN
  LOGGING_LEVEL_COM_NETFLIX_DISCOVERY: WARN
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_NETFLIX_EUREKA: WARN
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
  LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: WARN

services:
  postgresdb:
    image: postgres:17-alpine
    container_name: task-tracker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-task_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *prod-logging

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: task-tracker-kafka
    ports:
      - "9092:29092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,kafka.cluster=WARN,kafka.controller=WARN,kafka.coordinator=WARN,kafka.log=WARN,kafka.network=WARN,kafka.server=WARN,kafka.utils=WARN,org.apache.kafka=WARN,state.change.logger=WARN"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    logging: *prod-logging

  config-server:
    build:
      context: ./config-server
    container_name: task-tracker-config-server
    ports:
      - "8888:8888"
    environment:
      <<: *prod-spring-logging-env
      CONFIG_REPOSITORY_URI: ${CONFIG_REPOSITORY_URI:-https://github.com/BaTORfly/multi-user-task-sheduler.git}
      CONFIG_REPOSITORY_LABEL: ${PROD_CONFIG_REPOSITORY_LABEL:-main}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *prod-logging

  eureka-server:
    build:
      context: ./eureka-server
    container_name: task-tracker-eureka-server
    ports:
      - "8761:8761"
    environment:
      <<: *prod-spring-logging-env
      SPRING_PROFILES_ACTIVE: ${PROD_SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *prod-logging

  task-tracker-email-sender:
    build:
      context: ./task-tracker-email-sender
    container_name: task-tracker-email-sender
    ports:
      - "8081:8081"
    environment:
      <<: *prod-spring-logging-env
      SPRING_PROFILES_ACTIVE: ${PROD_SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
    depends_on:
      kafka:
        condition: service_started
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    logging: *prod-logging

  task-tracker-backend:
    build:
      context: ./task-tracker-backend
    container_name: task-tracker-backend
    ports:
      - "8080:8080"
    environment:
      <<: *prod-spring-logging-env
      SPRING_PROFILES_ACTIVE: ${PROD_SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/${POSTGRES_DB:-task_tracker}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      SCHEDULER_EMAIL: ${SCHEDULER_EMAIL:-scheduler@example.com}
      SCHEDULER_HASHED_PASSWORD: ${SCHEDULER_HASHED_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_LIFETIME: ${JWT_ACCESS_LIFETIME:-3600}
      JWT_REFRESH_LIFETIME: ${JWT_REFRESH_LIFETIME:-86400}
    depends_on:
      postgresdb:
        condition: service_healthy
      kafka:
        condition: service_started
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    logging: *prod-logging

  task-tracker-scheduler:
    build:
      context: ./task-tracker-scheduler
    container_name: task-tracker-scheduler
    ports:
      - "8082:8082"
    environment:
      <<: *prod-spring-logging-env
      SPRING_PROFILES_ACTIVE: ${PROD_SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      SCHEDULER_EMAIL: ${SCHEDULER_EMAIL:-scheduler@example.com}
      SCHEDULER_PASSWORD: ${SCHEDULER_PASSWORD}
      SCHEDULER_DAILY_CRON: "${SCHEDULER_DAILY_CRON:-0 0 0 * * *}"
      SCHEDULER_TIME_ZONE: ${SCHEDULER_TIME_ZONE:-Europe/Moscow}
      BACKEND_SERVICE_NAME: task-tracker-backend
    depends_on:
      kafka:
        condition: service_started
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      task-tracker-backend:
        condition: service_started
    logging: *prod-logging

volumes:
  postgres-data:
  kafka-data:
