server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPOSITORY_URI:https://github.com/BaTORfly/multi-user-task-sheduler.git}
          search-paths: config/{profile}
          clone-on-start: true
          default-label: ${CONFIG_REPOSITORY_LABEL:dev}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
