spring:
  main:
    log-startup-info: false
    banner-mode: 'off'

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      acks: all
    properties:
      delivery:
        timeout:
          ms: 30000
      request:
        timeout:
          ms: 10000

server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

scheduler:
  credentials:
    email: ${SCHEDULER_EMAIL}
    password: ${SCHEDULER_PASSWORD}
  reports:
    daily-cron: ${SCHEDULER_DAILY_CRON:0 0 0 * * *}
    zone: ${SCHEDULER_TIME_ZONE:Europe/Moscow}
  kafka:
    topic: ${SCHEDULER_EMAIL_TOPIC:EMAIL_SENDING_TASKS}

backend:
  service-name: ${BACKEND_SERVICE_NAME:task-tracker-backend}
  auth-path: ${BACKEND_AUTH_PATH:/api/v1/auth/login}
  users-path: ${BACKEND_USERS_PATH:/api/v1/users}

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    org.springframework.cloud.netflix.eureka: WARN
