spring:
  main:
    log-startup-info: false
    banner-mode: 'off'

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.json
    enabled: true
    parameters:
      scheduler.email: ${SCHEDULER_EMAIL}
      scheduler.hashed.password: ${SCHEDULER_HASHED_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        time_zone: UTC
    open-in-view: false

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    time-zone: UTC

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

springdoc:
  override-with-generic-response: false
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: io.github.batorfly.task_tracker_backend.api.controller

jwt:
  access:
    lifetime: ${JWT_ACCESS_LIFETIME:3600}
  refresh:
    lifetime: ${JWT_REFRESH_LIFETIME:86400}
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    org.springframework.cloud.netflix.eureka: WARN
